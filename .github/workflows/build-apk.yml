name: Build APK for Download

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      
      - uses: gradle/actions/setup-gradle@v3
      
      - name: Build APK
        run: ./gradlew assembleDebug
      
      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/ToothChat-latest.apk
      
      - name: Delete old release
        run: gh release delete latest --yes 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "ToothChat - Latest Build"
          files: release/ToothChat-latest.apk
          body: |
            ## 📲 Download ToothChat APK
            
            Click `ToothChat-latest.apk` below to download.
            
            ### Installation:
            1. Download the APK
            2. Open on your Android phone
            3. Allow "Install from unknown sources"
            4. Install and enjoy!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
